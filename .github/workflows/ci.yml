name: CI

# Public repo. It checks the active Next.js app in src-next/. The only credential is the job's own GITHUB_TOKEN
# (read-only, packages: read) to install the private @iitpulse/ui from GitHub Packages; no stored secret is used.
# Pull requests from forks are skipped: their GITHUB_TOKEN cannot read the org's private packages, and no token
# is ever handed to fork code (this is `pull_request`, never `pull_request_target`).
on:
  push:
    branches: [master]
    paths:
      - "src-next/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "src-next/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src-next

jobs:
  check:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Placeholder build-time values; real ones are set per deployment.
      NEXT_PUBLIC_API_GATEWAY: http://localhost:8000
      NEXT_PUBLIC_TEST_PORTAL_URI: http://localhost:3001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            src-next/.next/cache
          key: ${{ runner.os }}-bun-next-${{ hashFiles('src-next/bun.lock') }}-${{ hashFiles('src-next/src/**') }}
          restore-keys: |
            ${{ runner.os }}-bun-next-${{ hashFiles('src-next/bun.lock') }}-
            ${{ runner.os }}-bun-next-

      # src-next/.npmrc maps @iitpulse to GitHub Packages (no token). The token goes into a user-level ~/.npmrc for
      # this step only and is removed right after, so typecheck, lint and build never see it.
      # Needs: @iitpulse/ui package settings -> "Manage Actions access" -> Iitpulse/client-test (read).
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > ~/.npmrc
          status=0
          bun install --frozen-lockfile || status=$?
          rm -f ~/.npmrc
          exit $status

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
